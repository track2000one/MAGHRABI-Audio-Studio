name: Mask Tracking E2E Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mask-tracking-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mask-tracking-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build exact production container
        run: docker build -t maghrabi-mask-smoke:${GITHUB_SHA} .

      - name: Generate moving visual fixture
        run: |
          set -euo pipefail
          mkdir -p mask-smoke
          IMAGE="maghrabi-mask-smoke:${GITHUB_SHA}"
          docker run --rm -v "$PWD/mask-smoke:/work" --entrypoint ffmpeg "$IMAGE" -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=s=640x360:r=30:d=2.4" \
            -f lavfi -i "sine=frequency=510:sample_rate=48000:duration=2.4" \
            -shortest -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -b:a 96k /work/source.mp4
          test -s mask-smoke/source.mp4

      - name: Start production API with ephemeral CI credentials
        run: |
          set -euo pipefail
          IMAGE="maghrabi-mask-smoke:${GITHUB_SHA}"
          ADMIN_PASSWORD=$(python -c 'import secrets; print(secrets.token_hex(18))')
          AUTH_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')
          printf '%s' "$ADMIN_PASSWORD" > mask-smoke/admin-password.txt
          docker run -d --name maghrabi-mask-e2e -p 18004:8000 \
            -e ADMIN_USERNAME=mask-smoke-admin \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e AUTH_SECRET="$AUTH_SECRET" \
            -e DATA_DIR=/data \
            -e ENABLE_API_DOCS=0 \
            "$IMAGE"
          READY=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18004/api/health > mask-smoke/health.json; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = "1"
          grep -q '"status":"ok"' mask-smoke/health.json

      - name: Authenticate and enqueue tracked ellipse background defocus
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          password=open('mask-smoke/admin-password.txt').read()
          json.dump({'username':'mask-smoke-admin','password':password}, open('mask-smoke/login-payload.json','w'))
          PY
          curl -fsS -c mask-smoke/cookies.txt \
            -H 'Content-Type: application/json' \
            --data-binary @mask-smoke/login-payload.json \
            http://127.0.0.1:18004/api/auth/login > mask-smoke/login.json
          grep -q '"authenticated":true' mask-smoke/login.json
          cat > mask-smoke/manifest.json <<'JSON'
          {
            "clips":[
              {
                "id":"mask-smoke-clip",
                "lane":"V1",
                "fileIndex":0,
                "startAt":0.0,
                "timelineStartAt":0.0,
                "start":0.0,
                "end":2.20,
                "speed":1.0,
                "volume":1.0,
                "filter":"none",
                "text":"",
                "textSize":48,
                "textPosition":"bottom",
                "rotation":0,
                "fit":"contain",
                "brightness":0.0,
                "contrast":1.0,
                "saturation":1.0,
                "temperature":0.0,
                "vignette":0.0,
                "speedRamp":"off",
                "privacyEffect":"background-blur",
                "privacyMaskShape":"ellipse",
                "privacyX":0.18,
                "privacyY":0.24,
                "privacyWidth":0.26,
                "privacyHeight":0.34,
                "privacyIntensity":0.66,
                "privacyFeather":0.028,
                "privacyTrackingEnabled":true,
                "privacyTrackingPoints":[
                  {"time":0.0,"x":0.18,"y":0.24,"width":0.26,"height":0.34,"easing":"ease-in-out"},
                  {"time":0.48,"x":0.39,"y":0.18,"width":0.27,"height":0.35,"easing":"ease-out"},
                  {"time":1.0,"x":0.58,"y":0.31,"width":0.25,"height":0.32,"easing":"ease-in"}
                ]
              }
            ],
            "textTracks":[],
            "subtitleTracks":[],
            "audioTracks":[],
            "imageTracks":[],
            "videoOverlays":[],
            "transition":"none",
            "transitionDuration":0.30,
            "audioDuckingEnabled":false,
            "duckingStrength":0.50,
            "magneticSnap":true
          }
          JSON
          curl -fsS -b mask-smoke/cookies.txt \
            -F 'video_files=@mask-smoke/source.mp4;type=video/mp4' \
            -F 'manifest=<mask-smoke/manifest.json' \
            -F 'output_size=720p' \
            -F 'quality=draft' \
            -F 'name=Mask Tracking Ellipse Background Defocus Smoke' \
            http://127.0.0.1:18004/api/video/v12/queue > mask-smoke/enqueue.json
          python - <<'PY'
          import json
          payload=json.load(open('mask-smoke/enqueue.json'))
          assert payload.get('id'), payload
          open('mask-smoke/job-id.txt','w').write(payload['id'])
          PY
          rm -f mask-smoke/admin-password.txt mask-smoke/login-payload.json

      - name: Wait for mask render and verify MP4
        run: |
          set -euo pipefail
          JOB_ID=$(cat mask-smoke/job-id.txt)
          STATUS=""
          for attempt in $(seq 1 120); do
            curl -fsS -b mask-smoke/cookies.txt http://127.0.0.1:18004/api/video/v12/jobs > mask-smoke/jobs.json
            STATUS=$(JOB_ID="$JOB_ID" python - <<'PY'
          import json, os
          job_id=os.environ['JOB_ID']
          jobs=json.load(open('mask-smoke/jobs.json')).get('jobs', [])
          job=next((x for x in jobs if x.get('id')==job_id), {})
          print(job.get('status','missing'))
          PY
            )
            echo "mask render status: $STATUS"
            if [ "$STATUS" = "done" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then cat mask-smoke/jobs.json; docker logs maghrabi-mask-e2e; exit 1; fi
            sleep 2
          done
          test "$STATUS" = "done"
          curl -fsS -b mask-smoke/cookies.txt \
            http://127.0.0.1:18004/api/video/v12/jobs/${JOB_ID}/result \
            -o mask-smoke/result.mp4
          test -s mask-smoke/result.mp4
          IMAGE="maghrabi-mask-smoke:${GITHUB_SHA}"
          docker run --rm -v "$PWD/mask-smoke:/work" --entrypoint ffprobe "$IMAGE" \
            -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,width,height,channels,sample_rate \
            -of json /work/result.mp4 > mask-smoke/ffprobe.json
          python - <<'PY'
          import json
          payload=json.load(open('mask-smoke/ffprobe.json'))
          duration=float(payload['format']['duration'])
          streams=payload.get('streams',[])
          assert duration > 2.0, duration
          video=next(s for s in streams if s.get('codec_type')=='video')
          audio=next(s for s in streams if s.get('codec_type')=='audio')
          assert video.get('codec_name')=='h264', video
          assert video.get('width')==1280 and video.get('height')==720, video
          assert int(audio.get('sample_rate',0))==48000, audio
          print('mask-tracking-ellipse-background-defocus-ok', duration)
          PY

      - name: Save mask tracking smoke evidence
        if: always()
        run: |
          docker logs maghrabi-mask-e2e > mask-smoke/container.log 2>&1 || true
          docker rm -f maghrabi-mask-e2e >/dev/null 2>&1 || true
          rm -f mask-smoke/admin-password.txt mask-smoke/login-payload.json

      - name: Upload mask tracking smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mask-tracking-e2e-${{ github.sha }}
          path: |
            mask-smoke/manifest.json
            mask-smoke/enqueue.json
            mask-smoke/jobs.json
            mask-smoke/ffprobe.json
            mask-smoke/container.log
          if-no-files-found: warn
          retention-days: 14
