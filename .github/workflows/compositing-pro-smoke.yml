name: Advanced Compositing Pro E2E Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: compositing-pro-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compositing-pro-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build exact production container
        run: docker build -t maghrabi-compositing-smoke:${GITHUB_SHA} .

      - name: Generate composite fixture
        run: |
          set -euo pipefail
          mkdir -p compositing-smoke
          IMAGE="maghrabi-compositing-smoke:${GITHUB_SHA}"
          docker run --rm -v "$PWD/compositing-smoke:/work" --entrypoint ffmpeg "$IMAGE" -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=s=640x360:r=30:d=3.2" \
            -f lavfi -i "sine=frequency=620:sample_rate=48000:duration=3.2" \
            -shortest -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -b:a 96k /work/source.mp4
          test -s compositing-smoke/source.mp4

      - name: Start production API with ephemeral CI credentials
        run: |
          set -euo pipefail
          IMAGE="maghrabi-compositing-smoke:${GITHUB_SHA}"
          ADMIN_PASSWORD=$(python -c 'import secrets; print(secrets.token_hex(18))')
          AUTH_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')
          printf '%s' "$ADMIN_PASSWORD" > compositing-smoke/admin-password.txt
          docker run -d --name maghrabi-compositing-e2e -p 18005:8000 \
            -e ADMIN_USERNAME=compositing-smoke-admin \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e AUTH_SECRET="$AUTH_SECRET" \
            -e DATA_DIR=/data \
            -e ENABLE_API_DOCS=0 \
            "$IMAGE"
          READY=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18005/api/health > compositing-smoke/health.json; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = "1"
          grep -q '"status":"ok"' compositing-smoke/health.json

      - name: Authenticate and enqueue layered blend render
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          password=open('compositing-smoke/admin-password.txt').read()
          json.dump({'username':'compositing-smoke-admin','password':password}, open('compositing-smoke/login-payload.json','w'))
          PY
          curl -fsS -c compositing-smoke/cookies.txt \
            -H 'Content-Type: application/json' \
            --data-binary @compositing-smoke/login-payload.json \
            http://127.0.0.1:18005/api/auth/login > compositing-smoke/login.json
          grep -q '"authenticated":true' compositing-smoke/login.json
          cat > compositing-smoke/manifest.json <<'JSON'
          {
            "clips":[
              {
                "id":"compositing-source",
                "lane":"V1",
                "fileIndex":0,
                "startAt":0.0,
                "timelineStartAt":0.0,
                "start":0.0,
                "end":3.0,
                "speed":1.0,
                "volume":1.0,
                "filter":"none",
                "text":"",
                "textSize":48,
                "textPosition":"bottom",
                "rotation":0,
                "fit":"contain",
                "brightness":0.0,
                "contrast":1.0,
                "saturation":1.0,
                "temperature":0.0,
                "vignette":0.0,
                "speedRamp":"off",
                "privacyEffect":"none"
              }
            ],
            "textTracks":[],
            "subtitleTracks":[],
            "audioTracks":[],
            "imageTracks":[],
            "videoOverlays":[],
            "transition":"none",
            "transitionDuration":0.25,
            "audioDuckingEnabled":false,
            "duckingStrength":0.50,
            "magneticSnap":true,
            "adjustmentLayers":[
              {
                "id":"comp-punch",
                "name":"Punch Overlay",
                "enabled":true,
                "startAt":0.20,
                "endAt":2.80,
                "blendMode":"overlay",
                "opacity":0.48,
                "opacityKeyframes":[
                  {"time":0.0,"opacity":0.12,"easing":"ease-in-out"},
                  {"time":0.45,"opacity":0.62,"easing":"ease-out"},
                  {"time":1.0,"opacity":0.20,"easing":"ease-in"}
                ],
                "brightness":0.025,
                "contrast":1.18,
                "saturation":1.12,
                "hue":5,
                "blur":0.0,
                "sharpen":0.28,
                "vignette":0.16,
                "grain":0.24,
                "glow":0.0,
                "lightLeak":0.0,
                "zoom":1.0,
                "panX":0.0,
                "panY":0.0
              },
              {
                "id":"comp-glow",
                "name":"Glow Screen",
                "enabled":true,
                "startAt":0.55,
                "endAt":2.45,
                "blendMode":"screen",
                "opacity":0.30,
                "opacityKeyframes":[],
                "brightness":0.035,
                "contrast":1.03,
                "saturation":0.94,
                "hue":-4,
                "blur":0.05,
                "sharpen":0.0,
                "vignette":0.08,
                "grain":0.0,
                "glow":0.38,
                "lightLeak":0.31,
                "zoom":1.08,
                "panX":0.16,
                "panY":-0.10
              }
            ],
            "compoundGroups":[
              {"id":"compound-smoke","name":"Composite Range","startAt":0.2,"endAt":2.8,"collapsed":true}
            ]
          }
          JSON
          curl -fsS -b compositing-smoke/cookies.txt \
            -F 'video_files=@compositing-smoke/source.mp4;type=video/mp4' \
            -F 'manifest=<compositing-smoke/manifest.json' \
            -F 'output_size=720p' \
            -F 'quality=draft' \
            -F 'name=Advanced Compositing Pro Smoke' \
            http://127.0.0.1:18005/api/video/v12/queue > compositing-smoke/enqueue.json
          python - <<'PY'
          import json
          payload=json.load(open('compositing-smoke/enqueue.json'))
          assert payload.get('id'), payload
          open('compositing-smoke/job-id.txt','w').write(payload['id'])
          PY
          rm -f compositing-smoke/admin-password.txt compositing-smoke/login-payload.json

      - name: Wait for compositing render and verify MP4
        run: |
          set -euo pipefail
          JOB_ID=$(cat compositing-smoke/job-id.txt)
          STATUS=""
          for attempt in $(seq 1 120); do
            curl -fsS -b compositing-smoke/cookies.txt http://127.0.0.1:18005/api/video/v12/jobs > compositing-smoke/jobs.json
            STATUS=$(JOB_ID="$JOB_ID" python - <<'PY'
          import json, os
          job_id=os.environ['JOB_ID']
          jobs=json.load(open('compositing-smoke/jobs.json')).get('jobs', [])
          job=next((x for x in jobs if x.get('id')==job_id), {})
          print(job.get('status','missing'))
          PY
            )
            echo "compositing render status: $STATUS"
            if [ "$STATUS" = "done" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then cat compositing-smoke/jobs.json; docker logs maghrabi-compositing-e2e; exit 1; fi
            sleep 2
          done
          test "$STATUS" = "done"
          curl -fsS -b compositing-smoke/cookies.txt \
            http://127.0.0.1:18005/api/video/v12/jobs/${JOB_ID}/result \
            -o compositing-smoke/result.mp4
          test -s compositing-smoke/result.mp4
          IMAGE="maghrabi-compositing-smoke:${GITHUB_SHA}"
          docker run --rm -v "$PWD/compositing-smoke:/work" --entrypoint ffprobe "$IMAGE" \
            -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,width,height,channels,sample_rate \
            -of json /work/result.mp4 > compositing-smoke/ffprobe.json
          python - <<'PY'
          import json
          payload=json.load(open('compositing-smoke/ffprobe.json'))
          duration=float(payload['format']['duration'])
          streams=payload.get('streams',[])
          assert duration > 2.7, duration
          video=next(s for s in streams if s.get('codec_type')=='video')
          audio=next(s for s in streams if s.get('codec_type')=='audio')
          assert video.get('codec_name')=='h264', video
          assert video.get('width')==1280 and video.get('height')==720, video
          assert int(audio.get('sample_rate',0))==48000, audio
          print('advanced-compositing-pro-ok', duration)
          PY

      - name: Save compositing smoke evidence
        if: always()
        run: |
          docker logs maghrabi-compositing-e2e > compositing-smoke/container.log 2>&1 || true
          docker rm -f maghrabi-compositing-e2e >/dev/null 2>&1 || true
          rm -f compositing-smoke/admin-password.txt compositing-smoke/login-payload.json

      - name: Upload compositing smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compositing-pro-e2e-${{ github.sha }}
          path: |
            compositing-smoke/manifest.json
            compositing-smoke/enqueue.json
            compositing-smoke/jobs.json
            compositing-smoke/ffprobe.json
            compositing-smoke/container.log
          if-no-files-found: warn
          retention-days: 14
