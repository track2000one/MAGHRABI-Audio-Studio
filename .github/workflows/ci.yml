name: Validate MAGHRABI Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact frontend dependency graph
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate Python SHA-256 lock
        run: |
          grep -q -- '--hash=sha256:' backend/requirements.lock.txt
          grep -Eq '^torch==2\.0\.1\+cpu' backend/requirements.lock.txt
          grep -Eq '^torchaudio==2\.0\.2\+cpu' backend/requirements.lock.txt
          python -m pip install --upgrade pip >/dev/null
          python -m pip install --dry-run --ignore-installed --require-hashes \
            --index-url https://pypi.org/simple \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r backend/requirements.lock.txt >/tmp/v34-pip-dry-run.txt

      - name: Validate Python syntax
        run: python -m py_compile backend/app/*.py

      - name: Validation complete
        run: echo "Creator V34 validation completed from exact npm and Python SHA-256 locks"
